[tool.poetry]
name = "cubexpress"
version = "0.2.6"
description = "Efficient processing of cubic Earth-observation (EO) data."
authors = ["Julio Contreras <contrerasnetk@gmail.com>"]
repository = "https://github.com/andesdatacube/cubexpress"
documentation = "https://andesdatacube.github.io/cubexpress"
readme = "README.md"
keywords = ["earth-engine", "sentinel-2", "geospatial", "eo", "cube"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: GIS",
]
packages = [{ include = "cubexpress" }]

[tool.poetry.dependencies]
python = "^3.10"
pyproj = ">=3.6.0"
earthengine-api = ">=1.5.12"
rasterio = ">=1.3.0"
shapely = ">=2.0.0"
numpy = ">=1.24.0"
pandas = ">=1.5.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.2.0"
pytest-cov = ">=4.0.0"
ruff = ">=0.1.0"
mypy = ">=1.5.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ──────────────────────────────────────────────────────────────────────────────
# Ruff  (format + lint + import-sort: replaces black AND isort)
# ──────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "PERF"]
ignore = ["E501", "E731", "E722", "B028", "SIM108", "PERF203", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG", "PLR2004", "B007", "F841"]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# ──────────────────────────────────────────────────────────────────────────────
# Mypy
# ──────────────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
files = ["cubexpress"]
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
strict_optional = true

# ──────────────────────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-v", "--tb=short", "--strict-markers", "-m", "not integration"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring Earth Engine connection",
    "needs_ee: marks tests that build ee objects (skipped if EE unavailable)",
]

# ──────────────────────────────────────────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["cubexpress"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]